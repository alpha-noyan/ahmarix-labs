
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs | Ahmarix Labs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: { brand: '#6558E8' }
    }}}
  </script>
</head>
<body class="font-sans text-slate-900">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-extrabold">Ahmarix<span class="text-brand">Labs.</span></a>
      <div class="hidden md:flex gap-8 text-sm font-medium">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#apps">Our Apps</a>
        <a href="blogs.html" class="text-brand">Blogs</a>
      </div>
      <button id="menuBtn" class="md:hidden text-2xl" aria-label="Open menu">☰</button>
    </nav>
    <div id="mobileMenu" class="hidden md:hidden px-6 pb-5 space-y-4">
      <a href="index.html" class="block">Home</a>
      <a href="index.html#apps" class="block">Our Apps</a>
      <a href="blogs.html" class="block">Blogs</a>
    </div>
  </header>

  <section class="bg-slate-950 text-white py-24">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <span class="text-indigo-300 text-sm font-semibold uppercase tracking-widest">Ahmarix Labs Journal</span>
      <h1 class="text-4xl md:text-6xl font-extrabold mt-5">Insights & Ideas</h1>
      <p class="text-slate-300 mt-6 max-w-2xl mx-auto leading-7">
        Thoughts on technology, mobile applications, digital innovation
        and creating better experiences for everyone.
      </p>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-6 py-20">
    <div class="flex flex-wrap gap-3 mb-12 justify-center">
      <button class="filter-btn bg-brand text-white px-5 py-2 rounded-full text-sm" data-filter="All">All</button>
      <button class="filter-btn bg-slate-100 px-5 py-2 rounded-full text-sm" data-filter="Technology">Technology</button>
      <button class="filter-btn bg-slate-100 px-5 py-2 rounded-full text-sm" data-filter="Mobile Apps">Mobile Apps</button>
      <button class="filter-btn bg-slate-100 px-5 py-2 rounded-full text-sm" data-filter="Innovation">Innovation</button>
    </div>

    <div id="blogContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    <p id="emptyMessage" class="hidden text-center text-slate-500 py-12">
      No articles found in this category.
    </p>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center">
    <p>© <span id="year"></span> Ahmarix Labs. All rights reserved.</p>
    <a href="index.html" class="inline-block mt-3 hover:text-white">Back to Home</a>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/blogs.js"></script>
</body>
</html>
